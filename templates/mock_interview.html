<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Mock Interview</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #081120, #111827, #312E81);
            color: white;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(90deg, #60A5FA, #A855F7);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #CBD5E1;
            font-size: 17px;
        }

        .card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .question-box {
            border-left: 5px solid #7C3AED;
            background: #0F172A;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .question-box h2 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .question {
            font-size: 22px;
            font-weight: 600;
            color: #E2E8F0;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;

            background: #0F172A;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 15px;

            padding: 20px;
            color: white;
            font-size: 16px;
            outline: none;

            transition: 0.3s;
        }

        textarea:focus {
            border-color: #7C3AED;
            box-shadow: 0 0 20px rgba(124,58,237,0.25);
        }

        textarea::placeholder {
            color: #64748B;
        }

        .btn {
            margin-top: 20px;
            padding: 15px 30px;

            border: none;
            border-radius: 14px;

            background: linear-gradient(90deg, #2563EB, #7C3AED);

            color: white;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(124,58,237,0.4);
        }

        .feedback {
            background: #0F172A;
            border-radius: 18px;
            padding: 30px;

            line-height: 1.8;
            white-space: pre-wrap;

            border-left: 5px solid #22C55E;
        }

        .feedback h2 {
            margin-bottom: 20px;
        }

        .navigation {
            margin-top: 25px;

            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 12px;

            color: white;
            border: 1px solid rgba(255,255,255,0.15);

            transition: 0.3s;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #94A3B8;
        }

        @media(max-width: 768px) {

            body {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 35px;
            }

            .card {
                padding: 22px;
            }

            .question {
                font-size: 18px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <h1>🎤 AI Mock Interview</h1>

        <p>
            Practice interviews with your AI-powered technical interviewer
        </p>

    </div>


    <!-- Interview Question -->

    <div class="card">

        <div class="question-box">

            <h2>🎯 Interview Question</h2>

            <div class="question">
                {{ question }}
            </div>

        </div>


        <!-- Answer Form -->

        <form method="POST">

            <textarea
                name="answer"
                placeholder="Type your answer here..."
                required
            ></textarea>

            <br>

            <button type="submit" class="btn">
                🤖 Evaluate My Answer
            </button>

        </form>

    </div>


    <!-- AI Feedback -->

    {% if feedback %}

    <div class="card">

        <div class="feedback">

            <h2>🧠 AI Interview Feedback</h2>

            {{ feedback }}

        </div>

    </div>

    {% endif %}


    <!-- Navigation -->

    <div class="navigation">

        <a href="/" class="nav-btn">
            🏠 Home
        </a>

        <a href="/dashboard" class="nav-btn">
            📊 Dashboard
        </a>

        <a href="/chat" class="nav-btn">
            💬 AI Career Coach
        </a>

    </div>


    <div class="footer">

        Made with ❤️ using Flask + Gemini AI

    </div>

</div>

</body>

</html>
