<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<style>

body{

background:#081120;

font-family:Poppins,sans-serif;

color:white;

}

.container{

width:80%;

margin:40px auto;

}

.chat-box{

height:500px;

overflow-y:auto;

background:#111827;

padding:20px;

border-radius:15px;

margin-bottom:20px;

}

.message{

padding:12px;

margin:10px 0;

border-radius:10px;

}

.user{

background:#2563EB;

text-align:right;

}

.ai{

background:#312E81;

}

form{

display:flex;

gap:10px;

}

input{

flex:1;

padding:15px;

border:none;

border-radius:10px;

font-size:16px;

}

button{

padding:15px 25px;

border:none;

border-radius:10px;

background:#2563EB;

color:white;

cursor:pointer;

}

button:hover{

background:#1D4ED8;

}

</style>

</head>

<body>

<div class="container">

<h1>🤖 AI Resume Chat</h1>

<div class="chat-box">

{% if question %}

<div class="message user">

{{ question }}

</div>

{% endif %}

{% if answer %}

<div class="message ai">

{{ answer }}

</div>

{% endif %}

</div>

<form method="POST">

<input
type="text"
name="question"
placeholder="Ask anything about your resume..."
required>

<button>

Send

</button>

</form>

</div>

</body>

</html>
